name: Build Cracked GREEN V12
on:
  workflow_dispatch:
  push:
    paths:
      - 'original.apk'
      - 'patches/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install apktool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool
          chmod +x apktool
          sudo mv apktool /usr/local/bin/
          sudo mv apktool.jar /usr/local/bin/

      - name: Decode APK
        run: |
          if [ ! -f original.apk ]; then
            echo "Upload original.apk to repo root first"
            exit 1
          fi
          apktool d -f original.apk -o green

      - name: Apply patches
        run: |
          # 1. GreenApi.validate always success
          python3 << 'PY'
import os
path = "green/smali_classes2/com/xyz/app/GreenApi.smali"
if not os.path.exists(path):
    path = "green/smali/com/xyz/app/GreenApi.smali"
with open(path) as f:
    c = f.read()
start = c.find(".method public static validate(Ljava/lang/String;Z)Lcom/xyz/app/GreenApi$Result;")
if start == -1:
    print("validate not found")
    exit(1)
nextm = c.find("\n.method ", start+10)
if nextm == -1: nextm = len(c)
end = c.rfind(".end method", start, nextm)
new = '''.method public static validate(Ljava/lang/String;Z)Lcom/xyz/app/GreenApi$Result;
    .registers 3
    .annotation system Ldalvik/annotation/Throws;
        value = {
            Ljava/lang/Exception;
        }
    .end annotation

    new-instance v0, Lcom/xyz/app/GreenApi$Result;
    invoke-direct {v0}, Lcom/xyz/app/GreenApi$Result;-><init>()V
    const-wide/16 v1, 0x0
    iput-wide v1, v0, Lcom/xyz/app/GreenApi$Result;->expires:J
    const/4 v1, 0x0
    iput-boolean v1, v0, Lcom/xyz/app/GreenApi$Result;->force:Z
    const-string v1, ""
    iput-object v1, v0, Lcom/xyz/app/GreenApi$Result;->link:Ljava/lang/String;
    return-object v0
.end method
'''
c = c[:start] + new + c[end+len(".end method"):]
# also no-op consume + log
for sig, body in [
(".method public static consume(Lcom/xyz/app/GreenApi$Result;)V",
'''.method public static consume(Lcom/xyz/app/GreenApi$Result;)V
    .registers 1
    .annotation system Ldalvik/annotation/Throws;
        value = {
            Ljava/lang/Exception;
        }
    .end annotation
    return-void
.end method
'''),
(".method public static log(Landroid/content/Context;Ljava/lang/String;)V",
'''.method public static log(Landroid/content/Context;Ljava/lang/String;)V
    .registers 2
    .annotation system Ldalvik/annotation/Throws;
        value = {
            Ljava/lang/Exception;
        }
    .end annotation
    return-void
.end method
''')
]:
    s = c.find(sig)
    if s != -1:
        nm = c.find("\n.method ", s+10)
        if nm == -1: nm = len(c)
        e = c.rfind(".end method", s, nm)
        c = c[:s] + body + c[e+len(".end method"):]
with open(path, "w") as f:
    f.write(c)
print("GreenApi patched")
PY

          # 2. IntegrityVerifier + x22.a always true
          python3 << 'PY'
import os, glob
for pattern in ["green/smali/**/IntegrityVerifier.smali", "green/smali_classes*/**/IntegrityVerifier.smali"]:
    for path in glob.glob(pattern, recursive=True):
        with open(path) as f: c = f.read()
        start = c.find(".method static verify(Ljava/io/File;[[BLjava/lang/String;)Z")
        if start != -1:
            nextm = c.find("\n.method ", start+10)
            if nextm == -1: nextm = len(c)
            end = c.rfind(".end method", start, nextm)
            new = '''.method static verify(Ljava/io/File;[[BLjava/lang/String;)Z
    .registers 3
    const/4 v0, 0x1
    return v0
.end method
'''
            c = c[:start] + new + c[end+len(".end method"):]
            with open(path, "w") as f: f.write(c)
            print("IntegrityVerifier patched", path)
for pattern in ["green/smali/**/x22/a.smali", "green/smali_classes*/**/x22/a.smali"]:
    for path in glob.glob(pattern, recursive=True):
        with open(path) as f: c = f.read()
        start = c.find(".method public static a(Landroid/content/Context;)Z")
        if start != -1:
            nextm = c.find("\n.method ", start+10)
            if nextm == -1: nextm = len(c)
            end = c.rfind(".end method", start, nextm)
            new = '''.method public static a(Landroid/content/Context;)Z
    .registers 1
    const/4 v0, 0x1
    return v0
.end method
'''
            c = c[:start] + new + c[end+len(".end method"):]
            with open(path, "w") as f: f.write(c)
            print("x22.a patched", path)
PY

      - name: Build APK
        run: |
          apktool b green -o GREEN_V12_CRACKED_unsigned.apk

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
          # use apksigner if available, else jarsigner
          if command -v apksigner >/dev/null; then
            apksigner sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --out GREEN_V12_CRACKED.apk GREEN_V12_CRACKED_unsigned.apk
          else
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore debug.keystore -storepass android -keypass android GREEN_V12_CRACKED_unsigned.apk androiddebugkey
            mv GREEN_V12_CRACKED_unsigned.apk GREEN_V12_CRACKED.apk
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GREEN_V12_CRACKED
          path: GREEN_V12_CRACKED.apk
          retention-days: 5
